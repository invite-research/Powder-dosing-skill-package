<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title> Powders Database</title>
  <style>
    body{
      margin:0;
      font-family:'Segoe UI',sans-serif;
      color:#f5f5f5;
      min-height:100vh;
      background: linear-gradient(145deg, #1b2337 0%, #121827 40%, #0f1523 100%);
      background-attachment:fixed;
    }

    a{
      color:#8ec9ff;
      text-decoration:none;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: #2c3e50;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 12px;
      z-index: 1001;
      box-sizing: border-box;
    }

    .menu-btn {
      font-size: 24px;
      cursor: pointer;
      margin-right: 15px;
      user-select: none;
    }

    .sidebar {
      position: fixed;
      top: 60px;
      left: -260px;
      width: 260px;
      height: calc(100% - 60px);
      background: #34495e;
      color: white;
      transition: 0.3s ease;
      z-index: 1000;
      overflow-y: auto;
    }

    .sidebar a {
      display: block;
      padding: 14px 20px;
      color: white;
      text-decoration: none;
    }

    .sidebar a:hover {
      background: #1abc9c;
    }

    .sidebar.active {
      left: 0;
    }

    .overlay {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100% - 60px);
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 999;
    }

    .overlay.active {
      display: block;
    }

    .page{
      padding: 90px 20px 20px;
      box-sizing: border-box;
    }

    h1{
      margin:0 0 10px;
      font-size:2rem;
    }

    .sub{
      color:#cbd5e1;
      margin-bottom:18px;
    }

    .row{
      display:flex;
      gap:18px;
      flex-wrap:wrap;
      align-items:flex-start;
    }

    .card{
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.18);
      border-radius:16px;
      padding:18px;
      box-shadow: 0 18px 28px rgba(0,0,0,0.45);
      backdrop-filter: blur(14px);
    }

    .form-card{
      min-width:320px;
      max-width:380px;
      flex:0 0 auto;
    }

    .table-card{
      flex:1 1 680px;
      min-width:520px;
    }

    label{
      display:block;
      margin-top:10px;
      color:#e2e8f0;
      font-size:0.95rem;
    }

    input, textarea{
      width:100%;
      box-sizing:border-box;
      padding:10px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.20);
      color:#f5f5f5;
      margin-top:6px;
    }

    textarea{
      min-height:90px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    button{
      margin-top:12px;
      padding:10px 14px;
      border:none;
      border-radius:12px;
      background:#4b66ff;
      color:white;
      font-weight:700;
      cursor:pointer;
    }

    button.secondary{
      background:#6c757d;
      font-weight:600;
      margin-left:8px;
    }

    button.danger{
      background:#ff4f5e;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:0.98rem;
    }

    th, td{
      padding:10px 8px;
      border-bottom:1px solid rgba(255,255,255,0.15);
      text-align:left;
    }

    th{
      color:#ffd34e;
      font-weight:700;
    }

    .msg{
      margin:8px 0 0;
      color:#9ff0c5;
    }

    .err{
      margin:8px 0 0;
      color:#ff9aa5;
    }

    .actions button{
      margin:0 8px 0 0;
      padding:7px 10px;
      border-radius:10px;
    }

    @media(max-width:900px){
      .table-card{
        min-width:0;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="menu-btn" onclick="toggleMenu()">☰</span>
    <h3 style="margin:0;">Powders Database</h3>
  </div>

  <div id="sidebar" class="sidebar">
    <a href="/">Home</a>
    <a href="/powders">Powders</a>
    <a href="/datacode_registry">Datacode Registry</a>
    <a href="/containers">Containers</a>
    <a href="/spatulas">Spatulas</a>
  </div>

  <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

  <div class="page">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;">
      <div>
        <h1>Powders Database</h1>
        <div class="sub">All the Powdered chemicals stored database</div>
      </div>
    </div>

    <div class="row">
      <div class="card form-card">
        <h2 style="margin:0 0 6px;color:#ffd34e;">Add / Update</h2>

        <label>ID (Powder ID)
          <input id="powder_id" type="number" step="1"/>
        </label>

        <label>Name (Powder name)
          <input id="powder_name" type="text" />
        </label>
        
        <label>CAS (CAS number of the powder (if not mixed))
          <input id="cas_number" type="text" />
        </label>

        <label>Rho (Bulk density of the powder)
          <input id="bulk_density" type="number" step="0.001" />
        </label>

        <label>Flow (flowability High -> low)
          <input id="flowability" type="text" />
        </label>
        
        <label>Status (Status active -> inavtive)
          <input id="status" type="text" />
        </label>

        <div>
          <button onclick="save()">Save</button>
          <button class="secondary" onclick="clearForm()">Clear</button>
        </div>

        <div id="msg" class="msg"></div>
        <div id="err" class="err"></div>

        <p class="sub" style="margin-top:12px;">
          JSON endpoint: <a href="/powders.json">/powders.json</a>
        </p>

      
      </div>

      <div class="card table-card">
        <h2 style="margin:0 0 12px;color:#ffd34e;">Current powders</h2>
        <table>
          <thead>
            <tr>
              <th>ID </th>
              <th>Name</th>
              <th>CAS </th>
              <th>Rho </th>
              <th>Flow</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    function $(id){ return document.getElementById(id); }

    function fillForm(r){
      $('powder_id').value = r.powder_id ?? "";
      $('powder_name').value = r.powder_name ?? "";
      $('cas_number').value = r.cas_number ?? "";
      $('bulk_density').value = r.bulk_density ?? "";
      $('flowability').value = r.flowability ?? "";
      $('status').value = r.status ?? "";
    }

    function clearForm(){
      $('powder_id').value = "";
      $('powder_name').value = "";
      $('cas_number').value = "";
      $('bulk_density').value = "";
      $('flowability').value = "";
      $('status').value = "";
      $('msg').textContent = "";
      $('err').textContent = "";
    }

    async function refresh(){
      $('msg').textContent = "";
      $('err').textContent = "";
      try{
        const res = await fetch('/powders.json');
        if(!res.ok) throw new Error('HTTP ' + res.status);

        const rows = await res.json();
        const tb = $('tbody');
        tb.innerHTML = '';

        for(const r of rows){
          const tr = document.createElement('tr');

          const editBtn = document.createElement('button');
          editBtn.textContent = 'Edit';
          editBtn.onclick = () => fillForm(r);

          const delBtn = document.createElement('button');
          delBtn.textContent = 'Delete';
          delBtn.className = 'danger';
          delBtn.onclick = () => del(r.powder_id);

          const actionsTd = document.createElement('td');
          actionsTd.className = 'actions';
          actionsTd.appendChild(editBtn);
          actionsTd.appendChild(delBtn);

          tr.innerHTML = `
            <td>${r.powder_id ?? ""}</td>
            <td>${r.powder_name ?? ""}</td>
            <td>${r.cas_number ?? ""}</td>
            <td>${r.bulk_density ?? ""}</td>
            <td>${r.flowability ?? ""}</td>
            <td>${r.status ?? ""}</td>
          `;
          tr.appendChild(actionsTd);
          tb.appendChild(tr);
        }
      }catch(e){
        $('err').textContent = 'Failed to load powders: ' + e.message;
      }
    }

    async function save(){
      $('msg').textContent = '';
      $('err').textContent = '';

      try{
        const payload = {
          powder_id: Number($('powder_id').value),
          powder_name: $('powder_name').value,
          cas_number: $('cas_number').value,
          bulk_density: Number($('bulk_density').value),
          flowability: $('flowability').value,
          status: $('status').value
        };

        if(isNaN(payload.powder_id)){
          throw new Error('Powder id is required');
        }

        const r = await fetch('/api/powders/insert', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });

        if(!r.ok) throw new Error('HTTP ' + r.status);

        const j = await r.json();
        if(j.ok){
          $('msg').textContent = 'Saved';
          clearForm();
          await refresh();
        }else{
          $('err').textContent = j.error || 'Save failed';
        }
      }catch(e){
        $('err').textContent = e.toString();
      }
    }

    async function del(id){
      if(!confirm('Delete this powder?')) return;

      $('msg').textContent = '';
      $('err').textContent = '';

      try{
        const r = await fetch('/api/powders/delete', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({powder_id:id})
        });

        if(!r.ok) throw new Error('HTTP ' + r.status);

        const j = await r.json();
        if(j.ok){
          $('msg').textContent = 'Deleted';
          await refresh();
        }else{
          $('err').textContent = j.error || 'Delete failed';
        }
      }catch(e){
        $('err').textContent = e.toString();
      }
    }

    function toggleMenu() {
      document.getElementById("sidebar").classList.toggle("active");
      document.getElementById("overlay").classList.toggle("active");
    }

    document.querySelectorAll(".sidebar a").forEach(link => {
      link.addEventListener("click", () => {
        document.getElementById("sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
      });
    });

    refresh();
  </script>
</body>
</html>
